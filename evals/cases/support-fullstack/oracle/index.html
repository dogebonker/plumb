<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Support desk</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#182737;font:16px system-ui}main{max-width:1080px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:30px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #a8b5c2;border-radius:6px}button{cursor:pointer;background:white;color:inherit}button.primary{background:#234b68;color:white}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #ab5c00;outline-offset:3px}label{display:grid;gap:6px;margin:12px 0}textarea{min-height:90px;resize:vertical;width:100%}.filters{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.filters label:first-child{flex:1;min-width:180px}.tickets{display:grid;gap:10px}.ticket{text-align:left;width:100%;padding:18px;display:grid;gap:8px;overflow-wrap:anywhere}.ticket small{color:#42576a}dialog{border:1px solid #a8b5c2;border-radius:10px;width:min(560px,calc(100% - 28px));max-height:90vh;overflow:auto;padding:24px}dialog::backdrop{background:#13253888}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}[role=alert]{color:#992c19;white-space:pre-wrap}.history{font-size:14px;line-height:1.6}@media(max-width:600px){main{padding:16px}h1{font-size:25px}.filters{display:grid;grid-template-columns:1fr 1fr}.filters label:first-child{grid-column:1/-1}dialog{padding:18px}}</style>
<main><header><h1>Support desk</h1><button id="logout" hidden>Log out</button></header>
<form id="login"><h2>Welcome back</h2><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="primary">Log in</button><p role="alert"></p></form>
<section id="desk" hidden><div class="filters"><label>Search tickets<input id="search"></label><label>Status filter<select id="status" aria-label="Status filter"><option value="all">All</option><option>open</option><option>pending</option><option>resolved</option></select></label><label>Priority filter<select id="priority" aria-label="Priority filter"><option value="all">All</option><option>low</option><option>medium</option><option>high</option></select></label><button id="reset">Reset filters</button><button id="new" class="primary">New ticket</button></div><p role="status" id="count"></p><p role="alert" id="listError"></p><div class="tickets" id="tickets"></div></section>
<dialog aria-labelledby="dialogTitle"><form id="editor"><h2 id="dialogTitle"></h2><label>Title<input id="title" maxlength="120" required></label><label>Description<textarea id="description" maxlength="4000" required></textarea></label><div id="operatorFields"><label>Status<select id="editStatus" aria-label="Status"><option>open</option><option>pending</option><option>resolved</option></select></label><label>Priority<select id="editPriority" aria-label="Priority"><option>low</option><option>medium</option><option>high</option></select></label><label>Assignee<select id="assignee" aria-label="Assignee"></select></label></div><div id="activity"><h3>Activity</h3><div id="history" class="history"></div><label>Comment<textarea id="comment" maxlength="2000"></textarea></label><button type="button" id="addComment">Add comment</button></div><p role="alert" id="saveError"></p><div class="actions"><button id="save" class="primary"></button><button type="button" id="cancel">Cancel</button></div></form></dialog></main>
<script>
const $=id=>document.getElementById(id);let user,editing,opener;
async function api(url,method='GET',body){const response=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw Error(data.error||'Unable to save; please retry');return data}
async function refresh(){try{const query=new URLSearchParams({q:$('search').value,status:$('status').value,priority:$('priority').value});const {tickets}=await api('/api/tickets?'+query);$('tickets').replaceChildren();for(const t of tickets){const b=document.createElement('button');b.className='ticket';const strong=document.createElement('strong');strong.textContent=t.id+' · '+t.title;const small=document.createElement('small');small.textContent=t.status+' · '+t.priority+' · '+t.customer;b.append(strong,small);b.onclick=()=>open(t,b);$('tickets').append(b)}$('count').textContent=tickets.length+' tickets'+(tickets.length?'':' — No matching tickets');$('listError').textContent=''}catch(e){$('listError').textContent=e.message}}
function close(){document.querySelector('dialog').close();opener?.focus()}
function open(t,button){editing=t;opener=button;$('dialogTitle').textContent=t?'Ticket details':'New ticket';$('title').value=t?.title||'';$('description').value=t?.description||'';$('editStatus').value=t?.status||'open';$('editPriority').value=t?.priority||'medium';$('assignee').replaceChildren();for(const [value,label]of [['','Unassigned'],['operator@'+user.tenant+'.test','operator@'+user.tenant+'.test']]){const option=document.createElement('option');option.value=value;option.textContent=label;$('assignee').append(option)}$('assignee').value=t?.assignee||'';$('operatorFields').hidden=!t||user.role!=='operator';$('activity').hidden=!t;$('save').hidden=!!t&&user.role!=='operator';$('title').readOnly=$('description').readOnly=!!t&&user.role!=='operator';$('save').textContent=t?'Save changes':'Create ticket';$('saveError').textContent='';$('comment').value='';$('history').replaceChildren();for(const event of [...(t?.history||[]),...(t?.comments||[])]){const p=document.createElement('p');p.textContent=event.type?event.type+' — '+event.actor:event.text+' — '+event.actor;$('history').append(p)}document.querySelector('dialog').showModal();$('title').focus()}
$('login').onsubmit=async e=>{e.preventDefault();try{({user}=await api('/api/login','POST',Object.fromEntries(new FormData(e.target))));$('login').hidden=true;$('desk').hidden=false;$('logout').hidden=false;await refresh()}catch(error){$('login').querySelector('[role=alert]').textContent=error.message}};
$('logout').onclick=async()=>{await api('/api/logout','POST',{});$('desk').hidden=true;$('login').hidden=false;$('logout').hidden=true;$('login').reset()};
for(const id of ['search','status','priority'])$(id).oninput=refresh;
$('reset').onclick=()=>{$('search').value='';$('status').value=$('priority').value='all';refresh()};$('new').onclick=()=>open(null,$('new'));$('cancel').onclick=close;document.querySelector('dialog').addEventListener('cancel',e=>{e.preventDefault();close()});
document.querySelector('dialog').addEventListener('keydown',e=>{if(e.key!=='Tab')return;const controls=[...e.currentTarget.querySelectorAll('input,textarea,select,button')].filter(n=>n.getClientRects().length&&!n.disabled);const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}});
$('editor').onsubmit=async e=>{e.preventDefault();const body={title:$('title').value.trim(),description:$('description').value.trim()};if(!body.title||!body.description){$('saveError').textContent='Title and description are required';return}if(editing)Object.assign(body,{version:editing.version,status:$('editStatus').value,priority:$('editPriority').value,assignee:$('assignee').value||null});try{await api('/api/tickets'+(editing?'/'+editing.id:''),editing?'PATCH':'POST',body);close();await refresh()}catch(error){$('saveError').textContent=error.message}};
$('addComment').onclick=async()=>{try{const {ticket}=await api('/api/tickets/'+editing.id+'/comments','POST',{version:editing.version,text:$('comment').value.trim()});open(ticket,opener)}catch(error){$('saveError').textContent=error.message}};
</script></html>
