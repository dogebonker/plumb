ospace" font-size="13" letter-spacing="1.5" fill="#6E726C">CRITICAL TRACK, 9</text><text x="578" y="162" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E726C">Bare</text><rect x="578" y="172" width="128" height="22" rx="6" fill="#ECE7DA"/><rect class="s10" x="578" y="172" width="71.1" height="22" rx="6" fill="#6E726C"/><text class="v10" x="718.0" y="189" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#15181A">5/9</text><text x="578" y="224" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E726C">CLAUDE.md</text><rect x="578" y="234" width="128" height="22" rx="6" fill="#ECE7DA"/><rect class="s11" x="578" y="234" width="71.1" height="22" rx="6" fill="#6E726C"/><text class="v11" x="718.0" y="251" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#15181A">5/9</text><text x="578" y="286" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E726C">Plumb</text><rect x="578" y="296" width="128" height="22" rx="6" fill="#ECE7DA"/><rect class="s12" x="578" y="296" width="28.4" height="22" rx="6" fill="#E5532D"/><text class="v12" x="718.0" y="313" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#15181A">2/9</text><text x="800" y="138" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" letter-spacing="1.5" fill="#6E726C">THE OTHER 11</text><text x="800" y="162" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#6E726C">Bare</text><rect x="800" y="172" width="128" height