  <rect x="1" y="1" width="1038" height="418" rx="18" fill="#FFFDF7" stroke="#DDD8CB" stroke-width="1.5"/>
  <text x="48" y="62" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5" fill="#15181A">20 real merged PRs. Blind review. Three arms.</text>
  <text x="48" y="92" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#6E726C">We publish where we lose: the critical track timed out on 8 of 9 tasks. Outside it, Plumb led on quality, 6–7× slower.</text>
