<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 452" width="760" height="452" role="img" aria-label="Interface Design: you draft, the lenses challenge, you decide, then the interface freezes">
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .bg { fill: #F5F7F8; }
    .ink { fill: #1F2A33; }
    .quiet { fill: #5B6873; }
    .box { fill: #FFFFFF; stroke: #8A97A3; stroke-width: 1.25; }
    .opt { fill: #FFFFFF; stroke: #8A97A3; stroke-width: 1.25; stroke-dasharray: 5 4; }
    .you { fill: #E6EDFB; stroke: #2F5DD0; stroke-width: 2; }
    .freeze { fill: #FDF3DD; stroke: #E8A317; stroke-width: 2; }
    .line { fill: none; stroke: #8A97A3; stroke-width: 1.25; }
    .flow { fill: none; stroke: #2F5DD0; stroke-width: 1.5; stroke-dasharray: 5 7; animation: dash 1.4s linear infinite; }
    .head { fill: #8A97A3; }
    @keyframes dash { to { stroke-dashoffset: -24; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #15191D; }
      .ink { fill: #E6EAEE; }
      .quiet { fill: #9AA6B1; }
      .box, .opt { fill: #1C2228; stroke: #5E6B76; }
      .you { fill: #1D2A44; stroke: #6F95F0; }
      .freeze { fill: #2E2614; stroke: #E8A317; }
      .line { stroke: #5E6B76; }
      .flow { stroke: #6F95F0; }
      .head { fill: #5E6B76; }
    }
  </style>
  <defs>
    <marker id="arrow-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="760" height="452" rx="14"/>
  <text class="ink" x="24" y="38" font-size="17" font-weight="700">You draft the interface, the lenses challenge it, you decide</text>
  <text class="quiet" x="24" y="60" font-size="12.5">Each reviewer runs in a fresh context and never sees the drafting chat</text>

  <!-- challenge flows: lens -> interface -->
  <path class="flow" d="M216 104C250 104 252 200 288 200"/>
  <path class="flow" d="M216 156C250 156 252 210 288 210"/>
  <path class="flow" d="M216 208C250 208 252 220 288 220"/>
  <path class="flow" d="M216 260C250 260 252 230 288 230"/>
  <path class="flow" d="M216 312C250 312 252 240 288 240"/>
  <path class="flow" d="M216 364C250 364 252 250 288 250"/>

  <!-- lenses -->
  <rect class="box" x="24" y="84" width="192" height="40" rx="8"/>
  <text class="ink" x="40" y="109" font-size="13" font-weight="700">APoSD</text>
  <text class="quiet" x="200" y="109" font-size="11.5" text-anchor="end">arbiter</text>
  <rect class="box" x="24" y="136" width="192" height="40" rx="8"/>
  <text class="ink" x="40" y="161" font-size="13" font-weight="700">Clean Architecture</text>
  <rect class="box" x="24" y="188" width="192" height="40" rx="8"/>
  <text class="ink" x="40" y="213" font-size="13" font-weight="700">DDD / DDD Distilled</text>
  <rect class="box" x="24" y="240" width="192" height="40" rx="8"/>
  <text class="ink" x="40" y="265" font-size="13" font-weight="700">Refactoring.Guru</text>
  <rect class="box" x="24" y="292" width="192" height="40" rx="8"/>
  <text class="ink" x="40" y="317" font-size="13" font-weight="700">Release It! / DDIA</text>
  <rect class="opt" x="24" y="344" width="192" height="40" rx="8"/>
  <text class="ink" x="40" y="369" font-size="13" font-weight="700">fin-* pack</text>
  <text class="quiet" x="200" y="369" font-size="11.5" text-anchor="end">money only</text>

  <!-- your interface -->
  <rect class="you" x="288" y="150" width="196" height="150" rx="10"/>
  <text class="ink" x="306" y="178" font-size="14" font-weight="700">Your interface</text>
  <text class="ink" x="306" y="204" font-size="12.5">signatures</text>
  <text class="ink" x="306" y="226" font-size="12.5">interface comments</text>
  <text class="ink" x="306" y="248" font-size="12.5">depth statements</text>
  <text class="ink" x="306" y="270" font-size="12.5">cost card (computed)</text>

  <!-- right chain -->
  <path class="line" d="M484 225H504V118H518" marker-end="url(#arrow-g)"/>
  <rect class="box" x="520" y="84" width="216" height="68" rx="8"/>
  <text class="ink" x="536" y="108" font-size="13" font-weight="700">Challenge cards</text>
  <text class="quiet" x="536" y="126" font-size="11.5">steelman, then objection</text>
  <text class="quiet" x="536" y="142" font-size="11.5">max 3 per lens, tied to an ID</text>

  <path class="line" d="M628 152V182" marker-end="url(#arrow-g)"/>
  <rect class="you" x="520" y="184" width="216" height="56" rx="8"/>
  <text class="ink" x="536" y="208" font-size="13" font-weight="700">You respond</text>
  <text class="ink" x="536" y="226" font-size="11.5">accept, modify or overrule</text>

  <path class="line" d="M628 240V270" marker-end="url(#arrow-g)"/>
  <rect class="freeze" x="520" y="272" width="216" height="56" rx="8"/>
  <text class="ink" x="536" y="296" font-size="13" font-weight="700">Freeze</text>
  <text class="ink" x="536" y="314" font-size="11.5">stubs compile, hash recorded</text>

  <path class="line" d="M628 328V358" marker-end="url(#arrow-g)"/>
  <rect class="box" x="520" y="360" width="216" height="56" rx="8"/>
  <text class="ink" x="536" y="384" font-size="13" font-weight="700">Delegated</text>
  <text class="quiet" x="536" y="402" font-size="11.5">built behind the contract</text>

  <!-- calibration note -->
  <text class="quiet" x="288" y="332" font-size="11.5">Your answers feed calibration:</text>
  <text class="quiet" x="288" y="350" font-size="11.5">overruled 3x, a rule goes quiet;</text>
  <text class="quiet" x="288" y="368" font-size="11.5">accepted 3x, it shapes first drafts.</text>
</svg>
