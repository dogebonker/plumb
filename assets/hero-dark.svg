  <text x="62" y="272" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="900" font-size="212" letter-spacing="-10" fill="#F3F0E7">PLUMB<tspan fill="#FF6B3D">.</tspan></text>
  <text x="74" y="340" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="34" letter-spacing="-0.5" fill="#F3F0E7">Agents that ask before they build,</text>
  <text x="74" y="384" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="600" font-size="34" letter-spacing="-0.5" fill="#9CA19B">and build what you agreed to.</text>
