<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">Plumb</title>
  <desc id="d">The Plumb wordmark. A plumb bob swings, settles, and a line marks it true. Below, a rail runs through triage, plan, build, review and reconcile.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#151A1C" stroke-width="1"/></pattern>
    <radialGradient id="glow" cx="1010" cy="330" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF6B3D" stop-opacity="0.16"/><stop offset="1" stop-color="#FF6B3D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2441C"/><stop offset="0.45" stop-color="#FF6B3D"/><stop offset="0.6" stop-color="#FFB089"/>
      <stop offset="1" stop-color="#C2441C"/>
    </linearGradient>
    <style>
    .bob { transform-box: view-box; transform-origin: 1010px 92px; animation: swing 9.0s infinite; }
    @keyframes swing { 0.000% { transform: rotate(0deg); } 5.000% { transform: rotate(24deg); } 13.889% { transform: rotate(-18deg); } 22.778% { transform: rotate(13deg); } 31.667% { transform: rotate(-9deg); } 40.000% { transform: rotate(6deg); } 47.778% { transform: rotate(-3.5deg); } 55.000% { transform: rotate(1.8deg); } 61.667% { transform: rotate(-0.6deg); } 67.778% { transform: rotate(0deg); } 100% { transform: rotate(0deg); } }
    .bob { animation-timing-function: ease-in-out; }
    .trueline { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 9.0s infinite; }
    @keyframes draw { 0%, 68.333% { stroke-dashoffset: 340; opacity: 0; } 68.889% { opacity: 1; }
      76.667%, 95.556% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .settled { animation: settled 9.0s infinite; }
    @keyframes settled { 0%, 72.222% { opacity: 0; } 76.667%, 95.556% { opacity: 1; } 100% { opacity: 0; } }
    .measuring { animation: measuring 9.0s infinite; }
    @keyframes measuring { 0%, 70.000% { opacity: 1; } 72.222%, 97.778% { opacity: 0; } 100% { opacity: 1; } }
    .target { animation: target 9.0s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes target { 0%, 72.222% { stroke: #2A3033; transform: scale(1); }
      75.556% { stroke: #3FD07A; transform: scale(1.35); } 80.000%, 95.556% { stroke: #3FD07A; transform: scale(1); }
      100% { stroke: #2A3033; } }
    .runner { animation: run 7.5s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes run { 0%, 6% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; }
      70% { transform: translateX(628px); opacity: 1; } 92% { transform: translateX(628px); opacity: 1; }
      100% { transform: translateX(628px); opacity: 0; } }
    @keyframes st0 { 0%, 7.333% { fill: #0D1012; } 8.000%, 92% { fill: #FF6B3D; } 100% { fill: #0D1012; } } .st0 { animation: st0 7.5s linear infinite; } @keyframes st1 { 0%, 23.333% { fill: #0D1012; } 24.000%, 92% { fill: #FF6B3D; } 100% { fill: #0D1012; } } .st1 { animation: st1 7.5s linear infinite; } @keyframes st2 { 0%, 39.333% { fill: #0D1012; } 40.000%, 92% { fill: #FF6B3D; } 100% { fill: #0D1012; } } .st2 { animation: st2 7.5s linear infinite; } @keyframes st3 { 0%, 55.333% { fill: #0D1012; } 56.000%, 92% { fill: #FF6B3D; } 100% { fill: #0D1012; } } .st3 { animation: st3 7.5s linear infinite; } @keyframes st4 { 0%, 71.333% { fill: #0D1012; } 72.000%, 92% { fill: #FF6B3D; } 100% { fill: #0D1012; } } .st4 { animation: st4 7.5s linear infinite; }
    </style>
