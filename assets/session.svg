    <text x="500" y="35" text-anchor="middle" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#6F7672">~/shop-admin · plumb</text>
    <g font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15"><g class="line l0"><text x="36" y="92" xml:space="preserve"><tspan fill="#FF6B3D">❯ </tspan><tspan fill="#ECE9E1">/plumb-triage </tspan><tspan fill="#8E948F">add a CSV export for the filtered orders table</tspan></text><g class="cover c0"><rect x="54.1" y="73" width="1455.8" height="27" fill="#0B0E10"/><g class="k0"><rect class="blink" x="54.1" y="75" width="9" height="20" fill="#FF6B3D"/></g></g></g><g class="line l1"><text x="36" y="119" xml:space="preserve"><tspan fill="#8E948F">  What I found</tspan></text></g><g class="line l2"><text x="36" y="146" xml:space="preserve"><tspan fill="#5D6360">    web  </tspan><tspan fill="#ECE9E1">TypeScript · vitest   </tspan><tspan fill="#8E948F">pnpm test      </tspan><tspan fill="#3FD07A">✓ baseline green</tspan></text></g><g class="line l3"><text x="36" y="173" xml:space="preserve"><tspan fill="#5D6360">    api  </tspan><tspan fill="#ECE9E1">Go · go test          </tspan><tspan fill="#8E948F">go test ./...  </tspan><tspan fill="#3FD07A">✓ baseline green</tspan></text></g><g class="line l4"><text x="36" y="200" xml:space="preserve"><tspan fill="#8E948F">  Track  </tspan><tspan fill="#ECE9E1">standard</tspan><tspan fill="#8E948F"> · a new endpoint and a new button</tspan></text></g><g class="line l6"><text x="36" y="240" xml:space="preserve"><tspan fill="#FF6B3D">❯ </tspan><tspan fill="#ECE9E1">/plumb-plan </tspan><tspan fill="#8E948F">csv-export</tspan></text><g class="cover c6"><rect x="54.1" y="221" width="1112.7" height="27" fill="#0B0E10"/><g class="k6"><rect class="blink" x="54.1" y="223" width="9" height="20" fill="#FF6B3D"/></g></g></g><g class="line l7"><text x="36" y="267" xml:space="preserve"><tspan fill="#8E948F">  We're making  </tspan><tspan fill="#ECE9E1">a CSV of exactly what the table shows</tspan></text></g><g class="line l8"><text x="36" y="294" xml:space="preserve"><tspan fill="#FF6B3D">  1  </tspan><tspan fill="#ECE9E1">An admin hides the Price column, then exports.</tspan></text></g><g class="line l9"><text x="36" y="321" xml:space="preserve"><tspan fill="#5D6360">       </tspan><tspan fill="#FF6B3D">A ★ </tspan><tspan fill="#ECE9E1">the file leaves Price out     </tspan><tspan fill="#8E948F">B  every column</tspan></text></g><g class="line l10"><text x="36" y="348" xml:space="preserve"><tspan fill="#FF6B3D">  2  </tspan><tspan fill="#ECE9E1">Someone edits an order during the export.</tspan></text></g><g class="line l11"><text x="36" y="375" xml:space="preserve"><tspan fill="#5D6360">       </tspan><tspan fill="#FF6B3D">A ★ </tspan><tspan fill="#ECE9E1">rows as they were loaded      </tspan><tspan fill="#8E948F">B  re-read each row</tspan></text></g><g class="line l12"><text x="36" y="402" xml:space="preserve"><tspan fill="#7AA8FF">  you › </tspan><tspan fill="#ECE9E1">1A 2A</tspan></text><g class="cover c12"><rect x="108.2" y="383" width="959.1" height="27" fill="#0B0E10"/><g class="k12"><rect class="blink" x="108.2" y="385" width="9" height="20" fill="#FF6B3D"/></g></g></g><g class="line l13"><text x="36" y="429" xml:space="preserve"><tspan fill="#3FD07A">  ✓ plan approved</tspan><tspan fill="#8E948F"> · 4 documents · bound by hash</tspan></text></g><g class="line l15"><text x="36" y="469" xml:space="preserve"><tspan fill="#FF6B3D">❯ </tspan><tspan fill="#ECE9E1">/plumb-build </tspan><tspan fill="#8E948F">csv-export</tspan></text><g class="cover c15"><rect x="54.1" y="450" width="1121.7" height="27" fill="#0B0E10"/><g class="k15"><rect class="blink" x="54.1" y="452" width="9" height="20" fill="#FF6B3D"/></g></g></g><g class="line l16"><text x="36" y="496" xml:space="preserve"><tspan fill="#8E948F">  slice 01  </tspan><tspan fill="#ECE9E1">export endpoint </tspan></text><rect x="288.8" y="483" width="150" height="10" rx="5" fill="#1E2427"/><rect class="b16" x="288.8" y="483" width="150" height="10" rx="5" fill="#3FD07A"/><text class="g16" x="456.8" y="496" xml:space="preserve"><tspan fill="#FF8A80">red</tspan><tspan fill="#8E948F"> → </tspan><tspan fill="#3FD07A">green  ✓</tspan></text></g><g class="line l17"><text x="36" y="523" xml:space="preserve"><tspan fill="#8E948F">  slice 02  </tspan><tspan fill="#ECE9E1">export button   </tspan></text><rect x="288.8" y="510" width="150" height="10" rx="5" fill="#1E2427"/><rect class="b17" x="288.8" y="510" width="150" height="10" rx="5" fill="#3FD07A"/><text class="g17" x="456.8" y="523" xml:space="preserve"><tspan fill="#FF8A80">red</tspan><tspan fill="#8E948F"> → </tspan><tspan fill="#3FD07A">green  ✓</tspan></text></g><g class="line l18"><text x="36" y="550" xml:space="preserve"><tspan fill="#8E948F">  review    </tspan><tspan fill="#ECE9E1">0 blocking</tspan><tspan fill="#8E948F"> · </tspan><tspan fill="#ECE9E1">5/5</tspan><tspan fill="#8E948F"> examples pass on the running app</tspan></text></g><g class="line l19"><text x="36" y="577" xml:space="preserve"><tspan fill="#3FD07A">  ✓ ready for your sign-off</tspan></text></g><g class="line l20"><text x="36" y="604" xml:space="preserve"><tspan fill="#FF6B3D">❯ </tspan></text><rect class="blink" x="54.1" y="587" width="9" height="20" fill="#FF6B3D"/></g></g>
