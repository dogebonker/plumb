# .factory/system/lenses.yaml
profile: domain-core        # domain-core | crud-service | legacy
domain_model: rich          # rich (DDD) | transaction-scripts (PoEAA); recorded as an ADR
money: false
modules:
  - path: .
    language: go            # picks the language pack and adapter
    language_version: "1.22"
    bdd: off                # native | off | adopt (adopt is never set by triage)
overrides: {}               # e.g. split refactoring-guru into its own review agent
