# Go modules: go.mod. Packs from cxuu/golang-skills, unpinned until /factory-packs reads and pins them (factory-shared/packs.md).
index: go-style-core                   # the pack has no index skill; this one covers style and points to the rest
rules: [go-error-handling, go-interfaces, go-concurrency, go-testing]   # extra packs, each with its own SKILL.md
linter:
  check: golangci-lint run
  propose:                             # in line with the pack's go-linting skill
    - "enable: errcheck, govet, staticcheck, errorlint, gosec, revive"
    - "formatter: gofumpt"
