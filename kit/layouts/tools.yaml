# Checkers that enforce a layout mechanically. Release pins checked 2026-10-12 are stable and at least two weeks old;
# archgraph instead uses a published immutable source pin, verified 2026-10-19, with experimental native collection.
# Several stacks offer more than one: the Layout Decision picks one and records it on the
# Pattern line (gates.md, Layout). The Decision also writes the checker's config in full, from the pattern's layers and
# sibling rules, following `docs`; the first slice for that root creates it and proves it catches a planted violation.
# The ordered `layers` list in lenses.yaml cannot express sibling rules; these tools can.

typescript:
  archgraph:
    install: cargo install --git https://github.com/dogebonker/archgraph --rev 49464a7ec19fe8402b4258e751f7ba050c6eff19 --locked
    config: layout.yaml
    docs: https://github.com/dogebonker/archgraph/blob/49464a7ec19fe8402b4258e751f7ba050c6eff19/docs/guide.md
    checks: layers, forbidden edges and entrypoint bypasses; surface reports; new cycles via diff --fail-on new-cycles
    note: replace <tmp> with a fresh absolute directory outside the repository. Native engine is experimental; inspect unresolved imports and symbol coverage. check fails forbidden edges, not cycles or unplanned edges; compare base/head graphs for those. Keep the stack checker already chosen by the Layout Decision.
    command: archgraph scan . --engine native --symbols --rules layout.yaml -o <tmp>/archgraph-head.json && archgraph check <tmp>/archgraph-head.json
  dependency-cruiser:
    install: dependency-cruiser@18.4.0 and typescript@6.0.3 as devDependencies    # 18.6.0 (2026-10-11) is too recent
    config: .dependency-cruiser.cjs
    docs: https://github.com/sverweij/dependency-cruiser/blob/main/doc/rules-reference.md
    checks: path-regex forbidden rules, cycles, a baseline of known violations (depcruise-baseline, --ignore-known)
    note: needs typescript 6.0.x (6.0.3) because TS 7 has no compiler API (depcruise then checks 0 modules and exits 0) and typescript-eslint requires <6.1
    command: npx --no-install depcruise src
  eslint-plugin-boundaries:
    install: eslint-plugin-boundaries@7.2.0, eslint@10.11.0, @typescript-eslint/parser@8.71.0, eslint-import-resolver-typescript@4.4.5 and typescript@6.0.3 as devDependencies
    config: the repository's ESLint config
    docs: https://github.com/javierbrea/eslint-plugin-boundaries
    checks: element types by glob, boundaries/dependencies allow and deny policies
    note: 7.2.0 takes the rule's list as `policies` (`rules` is a deprecated alias); needs typescript 6.0.x (6.0.3) because TS 7 has no compiler API (depcruise then checks 0 modules and exits 0) and typescript-eslint requires <6.1; needs eslint-import-resolver-typescript 4.4.5 under `import/resolver`, or the rule passes silently
    command: npx --no-install eslint .
  steiger:                       # Feature-Sliced Design only
    install: steiger@0.7.0 and @feature-sliced/steiger-plugin@0.8.0 as devDependencies (requires Node >= 22.18.0)
    config: steiger.config.js, using the plugin's recommended config
    docs: https://github.com/feature-sliced/steiger
    checks: FSD rules, forbidden-imports, no-cross-imports, public-api
    command: npx --no-install steiger ./src
  eslint-plugin-import-x:        # feature folders
    install: eslint-plugin-import-x@4.17.1, eslint@10.11.0, @typescript-eslint/parser@8.71.0, eslint-import-resolver-typescript@4.4.5 and typescript@6.0.3 as devDependencies   # eslint-plugin-import 2.32.0 stops at ESLint 9
    config: the repository's ESLint config, import-x/no-restricted-paths zones, import-x/resolver
    docs: https://github.com/un-ts/eslint-plugin-import-x/blob/master/docs/rules/no-restricted-paths.md
    checks: a folder may not import from another
    note: needs typescript 6.0.x (6.0.3) because TS 7 has no compiler API (depcruise then checks 0 modules and exits 0) and typescript-eslint requires <6.1; needs eslint-import-resolver-typescript 4.4.5 under `import-x/resolver`, or the rule passes silently
    command: npx --no-install eslint .
python:
  archgraph:
    install: cargo install --git https://github.com/dogebonker/archgraph --rev 49464a7ec19fe8402b4258e751f7ba050c6eff19 --locked
    config: layout.yaml
    docs: https://github.com/dogebonker/archgraph/blob/49464a7ec19fe8402b4258e751f7ba050c6eff19/docs/guide.md
    checks: layers, forbidden edges and entrypoint bypasses; surface reports; new cycles via diff --fail-on new-cycles
    note: replace <tmp> with a fresh absolute directory outside the repository. Native engine is experimental; inspect unresolved imports and symbol coverage. check fails forbidden edges, not cycles or unplanned edges; compare base/head graphs for those. Keep the stack checker already chosen by the Layout Decision.
    command: archgraph scan . --engine native --symbols --rules layout.yaml -o <tmp>/archgraph-head.json && archgraph check <tmp>/archgraph-head.json
  import-linter:
    install: import-linter==2.15 as a dev dependency
    config: .importlinter (or [tool.importlinter] in pyproject.toml)
    docs: https://github.com/seddonym/import-linter/blob/main/docs/contract_types/layers.md
    checks: layers (with containers per module), independence, forbidden, acyclic_siblings, ignore_imports as a baseline
    note: its layers list runs highest first, the opposite of lenses.yaml; a src/ layout needs the project installed; output names modules, not paths
    command: lint-imports
  tach:
    install: tach==0.35.1 as a dev dependency   # 0.35.3 (2026-10-06) is too recent
    config: tach.toml
    docs: https://github.com/gauge-sh/tach
    checks: declared module dependencies, public interfaces, no cycles
    note: the innermost module needs depends_on = []; a missing key allows every import (the opposite of go-arch-lint)
    command: tach check
go:
  archgraph:
    install: cargo install --git https://github.com/dogebonker/archgraph --rev 49464a7ec19fe8402b4258e751f7ba050c6eff19 --locked
    config: layout.yaml
    docs: https://github.com/dogebonker/archgraph/blob/49464a7ec19fe8402b4258e751f7ba050c6eff19/docs/guide.md
    checks: layers, forbidden edges and entrypoint bypasses; surface reports; new cycles via diff --fail-on new-cycles
    note: replace <tmp> with a fresh absolute directory outside the repository. Native engine is experimental; inspect unresolved imports and symbol coverage. check fails forbidden edges, not cycles or unplanned edges; compare base/head graphs for those. Keep the stack checker already chosen by the Layout Decision.
    command: archgraph scan . --engine native --symbols --rules layout.yaml -o <tmp>/archgraph-head.json && archgraph check <tmp>/archgraph-head.json
  compiler:
    config: none; put each private part under internal/
    checks: internal/ is importable only from the tree above it; import cycles are illegal
    note: a nested internal/ hides one module's parts from its siblings; inside a module only an import cycle stops domain importing adapters
    command: go build ./...
  go-arch-lint:
    install: go get -tool github.com/fe3dback/go-arch-lint@v1.19.0 (a tool dependency in go.mod)
    config: .go-arch-lint.yml
    docs: https://github.com/fe3dback/go-arch-lint
    checks: components by path, mayDependOn
    note: the innermost component gets no deps entry (an empty mayDependOn is rejected); go get -tool rewrites go.mod and go.sum
    command: go tool go-arch-lint check
rust:
  cargo:
    config: none; put each layer or module in its own workspace crate and list only inward dependencies
    checks: a crate uses only what its Cargo.toml lists, and Cargo rejects cyclic crates
    command: cargo check --workspace
  cargo-modules:
    install: cargo install cargo-modules --version 0.27.0 --locked (a global install the user runs)
    config: none
    checks: module cycles inside one crate (--acyclic), not layer direction
    command: cargo modules dependencies --lib --acyclic
ruby:                            # reference only: the factory has no Ruby adapter
  packwerk:
    install: packwerk v3.3.1
    config: package.yml per package, package_todo.yml baseline
    command: bin/packwerk check
# Not recommended: cargo-pup (needs a pinned nightly), pytestarch (no stable release old enough), tsarch (no release since 2024-12).
