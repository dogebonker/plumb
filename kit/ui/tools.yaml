# Tools for factory-ui-ux. Why these and not others: docs/research/ui-ux-selection.md (UI-3).
#
# Variables: $REPO (absolute repository path), $NEUTRAL (fresh mktemp -d, the working directory), $OUT (the run
# folder, .software-factory/runs/ui/<run>/), $URL (the running app), $KIT (<kit>, factory-shared/gates.md, Paths).
# Every result is a candidate. What DESIGN.md declares (a brand hue, a chosen face, allowed motion) is a waiver
# recorded in the report, never an inline ignore in the repository. A missing tool is skipped, with its install line.

design-md:
  version: 0.4.0
  install: "npm i -g @google/design.md@0.4.0"
  lint: "design.md lint <design file>"          # 0 errors required
  diff: "design.md diff <old> <new>"            # tokens re-extracted at reconcile

impeccable:
  version: 4.1.0
  source: pbakaus/impeccable (Apache-2.0); only its detector is used, never its skill
  install: "npm i -g impeccable@4.1.0"
  code: "cd $NEUTRAL && impeccable detect --json --no-config --no-inline-ignores $REPO/<ui source> > $OUT/imp-src.json"
  rendered: "cd $NEUTRAL && impeccable detect --json --no-config --viewport <w>x<h> $URL/<route> > $OUT/imp-<route>-<w>.json"
  rendered_needs: "puppeteer and a Chrome it can launch; without them the rendered run is skipped and the Playwright pass covers the page"
  exit: "0 clean, 2 findings, 1 error"

ripgrep:
  run: "for each pattern: rg -n -P --json -e <its code patterns> <globs from that file> $REPO > $OUT/slop-rg-<id>.json"

playwright:
  version: 1.63.0
  install: "npm i -D @playwright/test@1.63.0 && npx playwright install chromium (in the repository, with the user's agreement)"
  viewports: ["390x844", "768x1024", "1280x800"]
  schemes: [light, dark]
  capture: >-
    one script, kept in the run folder and run from the repository (where @playwright/test resolves), per route and
    viewport: reducedMotion 'reduce', full-page screenshot to $OUT/shots/,
    page.evaluate of $KIT/ui/slop-metrics.js to $OUT/dom-metrics.json, console errors and failed requests;
    then page.route to force empty, failing (500) and slow responses for the route's data calls, with a
    screenshot of each state

axe:
  version: 4.13.0
  install: "npm i -D @axe-core/playwright@4.13.0 (in the repository, with the user's agreement)"
  run: "AxeBuilder({ page }).withTags(['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']) in the capture script, to $OUT/axe-<route>-<w>.json"
  findings: "violations are candidates; incomplete color-contrast items (gradients, glass, images) go to the model pass"

mockup_capture:
  version: 1.63.0
  install: "npx playwright@1.63.0 install chromium (downloads the package and the browser; the user's yes to mockups at the product gate is the agreement)"
  viewports: ["390, 844", "1280, 800"]
  schemes: "light, plus dark when the design file's colors include a dark set"
  run: >-
    cd $NEUTRAL && npx playwright@1.63.0 screenshot --browser chromium --viewport-size "<w>, <h>"
    --color-scheme <scheme> --full-page file://<absolute path of the mockup html> <absolute path of the png>
  note: "the Playwright CLI, run outside the repository: mockups need no test setup in it"

react-doctor:
  note: "the React language pack's checks (kit/languages/react.yaml) run as they do in factory-review"
